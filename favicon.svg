<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy rounded square background -->
  <rect width="32" height="32" rx="7" fill="#1E40AF"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#EEF6FF" stroke-width="2" opacity="0.3"/>
  <!-- Middle ring / orbit -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#10B981" stroke-width="2"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#EEF6FF"/>
  <!-- Orbit dot (accent) -->
  <circle cx="16" cy="10" r="1.5" fill="#10B981"/>
</svg>
